name: release

# Push a tag to release: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release, commit the updated cask

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: ./.github/gh-actions-runner-xcode-select.sh
      - run: brew update && brew install swiftly bash
      - run: swiftly init --skip-install --assume-yes --verbose && swiftly install
      - name: Unit tests
        run: ./build-debug.sh && ./script/test-unit.sh
      - name: Build HyprDarwin.app (ad-hoc signed)
        run: HYPRDARWIN_CODESIGN_IDENTITY=- ./build-app.sh --no-install --version "${GITHUB_REF_NAME#v}"
      - name: Check the bundle
        run: ./script/test-integration.sh --skip-xctest --app .release/HyprDarwin.app
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="HyprDarwin-$version.zip"
          (cd .release && zip -qry "$zip" HyprDarwin.app hypr)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=.release/$zip" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 ".release/$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" --title "HyprDarwin ${{ steps.package.outputs.version }}" --generate-notes
      - name: Update the Homebrew cask on main
        run: |
          git reset --hard -q # generated files from the build
          git fetch -q origin main && git checkout -q -B main origin/main
          ./script/update-cask.sh "${{ steps.package.outputs.version }}" "${{ steps.package.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hyprdarwin.rb
          git commit -m "Cask: HyprDarwin ${{ steps.package.outputs.version }}"
          git push origin main

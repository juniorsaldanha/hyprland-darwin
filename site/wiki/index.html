<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyprDarwin Wiki</title>
  <meta name="description" content="HyprDarwin wiki: installation, master tutorial, configuration, plugins and the CLI.">
  <meta name="theme-color" content="#07010f">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/cyber.css">
  <style>
    body {
      background:
        linear-gradient(rgba(180, 75, 255, 0.05) 1px, transparent 1px) 0 0 / 44px 44px,
        linear-gradient(90deg, rgba(180, 75, 255, 0.05) 1px, transparent 1px) 0 0 / 44px 44px,
        radial-gradient(60% 50% at 80% 0%, rgba(255, 43, 214, 0.12), transparent 70%),
        var(--bg);
      animation: grid-drift 30s linear infinite;
    }
    @keyframes grid-drift { to { background-position: 44px 44px, 44px 44px, 0 0, 0 0; } }

    .search-btn {
      display: flex; align-items: center; gap: 10px; margin-left: 24px; padding: 7px 12px; min-width: 220px;
      border-radius: 6px; border: 1px solid var(--line); background: rgba(20, 5, 43, 0.7); color: var(--muted);
      font: 14px var(--sans); cursor: pointer; transition: box-shadow 0.2s, border-color 0.2s;
    }
    .search-btn:hover { border-color: var(--magenta); box-shadow: 0 0 18px rgba(255, 43, 214, 0.35); }
    .search-btn kbd { margin-left: auto; }
    .menu-btn { display: none; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 18px; cursor: pointer; }
    @media (max-width: 900px) { .menu-btn { display: block; } .search-btn { min-width: 0; margin-left: auto; } .search-btn .txt, .search-btn kbd { display: none; } .topnav .links { margin-left: 8px; } }

    .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr) 220px; max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }
    @media (max-width: 1200px) { .layout { grid-template-columns: 260px minmax(0, 1fr); } .toc { display: none; } }
    @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

    /* ---------- sidebar ---------- */
    .sidebar {
      position: sticky; top: var(--nav-h); height: calc(100vh - var(--nav-h)); overflow-y: auto; padding: 24px 14px 40px 20px;
      border-right: 1px solid var(--line-soft); font-size: 15px;
    }
    @media (max-width: 900px) {
      .sidebar { position: fixed; z-index: 60; left: 0; top: var(--nav-h); width: 290px; background: rgba(7, 1, 15, 0.97);
        transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1); }
      .sidebar.open { transform: none; box-shadow: 0 0 60px rgba(255, 43, 214, 0.35); }
    }
    .sidebar a.home { display: block; padding: 6px 10px; color: var(--text); font-weight: 600; border-radius: 4px; }
    .sidebar details { margin-top: 6px; }
    .sidebar summary {
      list-style: none; cursor: pointer; padding: 8px 10px; font: 700 12px var(--display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--cyan);
      display: flex; align-items: center; justify-content: space-between; border-radius: 4px;
    }
    .sidebar summary::-webkit-details-marker { display: none; }
    .sidebar summary::after { content: "▸"; transition: transform 0.2s; color: var(--muted); }
    .sidebar details[open] summary::after { transform: rotate(90deg); }
    .sidebar summary:hover { background: rgba(180, 75, 255, 0.1); }
    .sidebar ul { list-style: none; margin: 2px 0 8px; padding: 0 0 0 10px; border-left: 1px solid var(--line-soft); margin-left: 12px; }
    .sidebar li a { position: relative; display: block; padding: 6px 12px; color: var(--muted); border-radius: 4px; transition: color 0.15s, background 0.15s, padding 0.15s; }
    .sidebar li a:hover { color: var(--text); background: rgba(180, 75, 255, 0.1); padding-left: 16px; text-shadow: none; }
    .sidebar a.on { color: var(--text) !important; background: linear-gradient(90deg, rgba(255, 43, 214, 0.22), transparent); }
    .sidebar a.on::before {
      content: ""; position: absolute; left: -11px; top: 4px; bottom: 4px; width: 3px; border-radius: 2px;
      background: var(--neon); box-shadow: 0 0 10px var(--magenta); animation: pulse-bar 2s ease-in-out infinite;
    }
    @keyframes pulse-bar { 50% { box-shadow: 0 0 18px var(--cyan); } }

    /* ---------- content ---------- */
    .content { padding: 36px clamp(16px, 4vw, 56px) 60px; min-width: 0; }
    .crumbs { font: 12px var(--mono); color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
    .crumbs b { color: var(--magenta); font-weight: 600; }
    .md.enter { animation: page-in 0.5s cubic-bezier(0.2, 0.9, 0.2, 1); }
    @keyframes page-in {
      0% { opacity: 0; transform: translateY(14px); filter: hue-rotate(80deg) blur(2px); }
      20% { opacity: 0.6; transform: translate(-3px, 8px); }
      30% { transform: translate(3px, 6px); }
      100% { opacity: 1; transform: none; filter: none; }
    }
    .md { max-width: 820px; }
    .md h1 { font: 900 clamp(30px, 4.6vw, 48px)/1.1 var(--display); margin: 0 0 18px; background: var(--neon); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 0.01em; }
    .md h2 {
      font: 700 25px/1.2 var(--display); margin: 46px 0 14px; padding-bottom: 8px; position: relative; letter-spacing: 0.02em;
      scroll-margin-top: calc(var(--nav-h) + 16px);
    }
    .md h2::after {
      content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 64px; background: var(--neon); box-shadow: 0 0 10px var(--magenta);
      transition: width 0.5s cubic-bezier(0.2, 0.9, 0.2, 1);
    }
    .md h2:hover::after { width: 100%; }
    .md h3 { font: 700 19px var(--sans); margin: 30px 0 10px; color: var(--cyan); scroll-margin-top: calc(var(--nav-h) + 16px); }
    .md h2 .anchor, .md h3 .anchor { opacity: 0; margin-left: 8px; color: var(--magenta); font-size: 0.8em; cursor: pointer; transition: opacity 0.2s; }
    .md h2:hover .anchor, .md h3:hover .anchor { opacity: 1; }
    .md p, .md li { color: #ddd2f5; }
    .md li { margin: 4px 0; }
    .md strong { color: var(--text); }
    .md :not(pre) > code { font-size: 0.88em; padding: 2px 6px; border-radius: 4px; background: rgba(180, 75, 255, 0.16); color: #ffd1f6; }
    .md pre { margin: 16px 0; position: relative; }
    .md pre .copy {
      position: absolute; top: 8px; right: 8px; opacity: 0; padding: 4px 10px; border-radius: 4px; cursor: pointer;
      font: 600 12px var(--sans); color: var(--cyan); background: rgba(20, 5, 43, 0.9); border: 1px solid var(--line); transition: opacity 0.2s;
    }
    .md pre:hover .copy { opacity: 1; }
    .md table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 15px; display: block; overflow-x: auto; }
    .md th { text-align: left; font: 700 12px var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan); padding: 10px; border-bottom: 1px solid var(--line); }
    .md td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    .md tr:hover td { background: rgba(180, 75, 255, 0.07); }
    .md blockquote { margin: 18px 0; padding: 12px 18px; border-left: 3px solid var(--violet); background: rgba(180, 75, 255, 0.1); border-radius: 0 6px 6px 0; }
    .md blockquote p { margin: 6px 0; }
    .md .callout { position: relative; overflow: hidden; }
    .md .callout .ctitle { font: 700 12px var(--display); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 4px; }
    .md .callout.note { border-color: var(--cyan); background: rgba(34, 228, 255, 0.08); } .md .callout.note .ctitle { color: var(--cyan); }
    .md .callout.tip { border-color: #7dff9b; background: rgba(125, 255, 155, 0.07); } .md .callout.tip .ctitle { color: #7dff9b; }
    .md .callout.warning { border-color: var(--yellow); background: rgba(249, 248, 113, 0.07); } .md .callout.warning .ctitle { color: var(--yellow); }
    .md .callout.important { border-color: var(--magenta); background: rgba(255, 43, 214, 0.09); } .md .callout.important .ctitle { color: var(--magenta); }
    .md hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); margin: 36px 0; }
    .md img { max-width: 100%; }

    .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 56px; max-width: 820px; }
    .pager a {
      display: block; padding: 14px 18px; border-radius: 6px; border: 1px solid var(--line-soft); background: var(--panel); color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .pager a:hover { border-color: var(--magenta); box-shadow: 0 0 22px rgba(255, 43, 214, 0.3); transform: translateY(-2px); text-shadow: none; }
    .pager small { display: block; font: 12px var(--mono); color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
    .pager .next { text-align: right; grid-column: 2; }
    .edit { display: inline-block; margin-top: 26px; font: 13px var(--mono); color: var(--muted); }

    /* ---------- on this page ---------- */
    .toc { position: sticky; top: var(--nav-h); height: calc(100vh - var(--nav-h)); overflow-y: auto; padding: 36px 16px; font-size: 14px; }
    .toc .t { font: 700 11px var(--display); letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    .toc a { display: block; padding: 4px 0 4px 12px; color: var(--muted); border-left: 2px solid var(--line-soft); transition: all 0.2s; }
    .toc a.h3 { padding-left: 24px; font-size: 13px; }
    .toc a.on { color: var(--text); border-left-color: var(--magenta); box-shadow: -6px 0 12px -6px var(--magenta); }

    /* ---------- search ---------- */
    .search { position: fixed; inset: 0; z-index: 100; display: none; place-items: start center; padding-top: 12vh; background: rgba(7, 1, 15, 0.7); backdrop-filter: blur(6px); }
    .search.open { display: grid; animation: fade 0.15s ease; }
    @keyframes fade { from { opacity: 0; } }
    .search .box {
      width: min(640px, calc(100vw - 32px)); border-radius: 10px; background: var(--panel-solid); border: 1px solid var(--magenta);
      box-shadow: 0 0 60px rgba(255, 43, 214, 0.4); overflow: hidden; animation: drop 0.25s cubic-bezier(0.2, 0.9, 0.2, 1);
    }
    @keyframes drop { from { transform: translateY(-14px) scale(0.98); } }
    .search input {
      width: 100%; padding: 16px 18px; background: transparent; border: none; border-bottom: 1px solid var(--line); outline: none;
      color: var(--text); font: 17px var(--sans);
    }
    .search ol { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
    .search li a { display: block; padding: 10px 12px; border-radius: 6px; color: var(--text); }
    .search li a small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
    .search li a.sel, .search li a:hover { background: rgba(255, 43, 214, 0.16); text-shadow: none; }
    .search mark { background: none; color: var(--magenta); font-weight: 700; }
    .search .empty { padding: 18px; color: var(--muted); text-align: center; }
    .scrim { display: none; }
    @media (max-width: 900px) { .scrim.open { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0, 0, 0, 0.5); } }
  </style>
</head>
<body>
  <div class="crt" aria-hidden="true"></div>
  <nav class="topnav">
    <button class="menu-btn" type="button" id="menu" aria-label="Menu">☰</button>
    <a class="brand" href="../"><img src="../icon.svg" alt="">HyprDarwin <span style="color: var(--magenta); font-size: 12px; letter-spacing: 0.3em">WIKI</span></a>
    <button class="search-btn" type="button" id="search-open"><span>⌕</span><span class="txt">Search the wiki…</span><kbd id="search-key">⌘K</kbd></button>
    <div class="links">
      <a class="wide" href="../">Home</a>
      <a href="https://github.com/juniorsaldanha/hyprland-darwin">GitHub</a>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
      <div class="crumbs" id="crumbs"></div>
      <article class="md" id="page"></article>
      <nav class="pager" id="pager"></nav>
      <a class="edit" id="edit" href="#">✎ Edit this page on GitHub</a>
    </main>
    <aside class="toc" id="toc"></aside>
  </div>

  <div class="search" id="search" role="dialog" aria-label="Search">
    <div class="box">
      <input id="q" type="search" placeholder="Search pages and sections…" autocomplete="off">
      <ol id="results"></ol>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js"></script>
  <script src="wiki.js"></script>
</body>
</html>
